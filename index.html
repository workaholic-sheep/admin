<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved (or system) theme before first paint so dark mode never flashes white.
      try {
        var saved = localStorage.getItem('theme');
        document.documentElement.dataset.theme = saved === 'dark' || saved === 'light' ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (error) { document.documentElement.dataset.theme = 'light'; }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f3" />
    <meta name="description" content="BBeckford Law client administration portal." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>BBeckford Law | Admin Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
